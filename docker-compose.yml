services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: atlas_cargo
      POSTGRES_USER: atlas_cargo
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: gunicorn atlas_cargo.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A atlas_cargo worker -l info
    env_file: .env
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  media:
