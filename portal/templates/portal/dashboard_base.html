{% extends "base.html" %}
{% block content %}
<div class="dashboard-shell">
  <aside class="dashboard-sidebar">
    <div class="dashboard-sidebar-label">Menu</div>
    <ul class="nav flex-column">
      {% for m in sidebar_modules %}
        <li class="nav-item">
          {% if m.url_name %}
            <a class="nav-link {% if request.resolver_match.view_name == m.url_name %}active{% endif %}" href="{% url m.url_name %}">
              <i class="bi bi-{{ m.icon }} me-2"></i>{{ m.name }}
            </a>
          {% else %}
            <span class="nav-link disabled d-flex align-items-center justify-content-between">
              <span><i class="bi bi-{{ m.icon }} me-2"></i>{{ m.name }}</span>
              {% if m.badge %}<span class="badge bg-secondary ms-2">{{ m.badge }}</span>{% endif %}
            </span>
          {% endif %}
        </li>
      {% endfor %}
    </ul>
  </aside>
  <main class="dashboard-content">
    {% block dashboard_content %}{% endblock %}
  </main>
</div>
{% endblock %}
