{% extends "base.html" %}
{% block title %}Sign in — Atlas Cargo{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 400px;">
  <div class="card border-0 shadow-sm p-4">
    <h1 class="h4 text-center mb-1">Sign in</h1>
    <p class="text-muted text-center small mb-4">Access your Atlas Cargo portal</p>
    {% if form.errors %}
      <div class="alert alert-danger py-2 small">Incorrect username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-navy w-100">Sign in</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </div>
</div>
{% endblock %}
